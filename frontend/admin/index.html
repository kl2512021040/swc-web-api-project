<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Users & Venues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="mb-4">Portal Pentadbir (Admin Dashboard)</h2>
        
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Senarai Pengguna Registered Users</div>
            <div class="card-body">
                <table class="table table-bordered align-middle">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Nama</th><th>Email</th><th>Peranan (Role)</th></tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="venues.html" class="btn btn-success">Pengurusan Venue &rarr;</a>
    </div>

    <script>
        const API_BASE = 'http://localhost/swc-web-api-project/backend/index.php';

        async function loadUsers() {
            const res = await fetch(`${API_BASE}/users`);
            const json = await res.json();
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            json.data.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td><span class="badge bg-info">${user.role}</span></td>
                    </tr>
                `;
            });
        }

        loadUsers();
    </script>
</body>
</html>
