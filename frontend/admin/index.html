<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Users & Venues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- NAVBAR ADMIN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Admin Portal</a>
            <div class="d-flex align-items-center gap-3">
                <span id="userGreeting" class="text-white fw-semibold"></span>
                <a href="../customer-profile/my-bookings.html" class="btn btn-outline-light btn-sm">Profil Saya</a>
                <button onclick="logout()" class="btn btn-danger btn-sm">Log Out</button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="mb-4">Portal Pentadbir (Admin Dashboard)</h2>
        
        <!-- BORANG DAFTAR USER UTK ADMIN -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-dark text-white">Daftar Pengguna Baharu (Admin Access)</div>
            <div class="card-body">
                <form id="adminCreateUserForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <input type="text" id="adminRegName" class="form-control" placeholder="Nama Penuh" required>
                        </div>
                        <div class="col-md-3">
                            <input type="email" id="adminRegEmail" class="form-control" placeholder="E-mel" required>
                        </div>
                        <div class="col-md-3">
                            <input type="password" id="adminRegPassword" class="form-control" placeholder="Kata Laluan" required>
                        </div>
                        <div class="col-md-3">
                            <select id="adminRegRole" class="form-select" required>
                                <option value="Admin">Admin</option>
                                <option value="Organiser">Organiser</option>
                                <option value="Customer">Customer</option>
                            </select>
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-primary">Daftar Pengguna</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- SENARAI PENGGUNA TERDAFTAR -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Senarai Pengguna Registered Users</div>
            <div class="card-body">
                <table class="table table-bordered align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Peranan (Role)</th>
                            <th>Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="venues.html" class="btn btn-success">Pengurusan Venue &rarr;</a>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
