<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Users & Venues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- NAVBAR ADMIN -->
    <nav class="navbar navbar-dark bg-dark mb-4 px-4 d-flex justify-content-between align-items-center">
        <span class="navbar-brand fw-bold mb-0">Admin Portal - Pengurusan Pengguna</span>
        <div>
            <a href="venues.html" class="btn btn-success btn-sm me-2 fw-bold">Pengurusan Venue &rarr;</a>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm fw-bold">Log Out</button>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="mb-4">Portal Pentadbir (Admin Dashboard)</h2>
        
        <!-- BORANG DAFTAR USER UTK ADMIN -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-dark text-white">Daftar Pengguna Baharu (Admin Access)</div>
            <div class="card-body">
                <form id="adminCreateUserForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <input type="text" id="adminRegName" class="form-control" placeholder="Nama Penuh" required>
                        </div>
                        <div class="col-md-3">
                            <input type="email" id="adminRegEmail" class="form-control" placeholder="E-mel" required>
                        </div>
                        <div class="col-md-3">
                            <input type="password" id="adminRegPassword" class="form-control" placeholder="Kata Laluan" required>
                        </div>
                        <div class="col-md-3">
                            <select id="adminRegRole" class="form-select" required>
                                <option value="Admin">Admin</option>
                                <option value="Organiser">Organiser</option>
                                <option value="Customer">Customer</option>
                            </select>
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-primary">Daftar Pengguna</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- SENARAI PENGGUNA TERDAFTAR -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Senarai Pengguna Registered Users</div>
            <div class="card-body">
                <table class="table table-bordered align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Peranan (Role)</th>
                            <th>Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- BUTANG NAVIGASI BAWAH KE VENUES -->
        <div class="text-end">
            <a href="venues.html" class="btn btn-success fw-bold px-4 py-2">Pengurusan Venue & Dewan &rarr;</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
