<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Venue - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Pengurusan Venue & Dewan</h2>
            <a href="index.html" class="btn btn-outline-secondary">&larr; Kembali ke Dashboard Pengguna</a>
        </div>
        
        <!-- BORANG TAMBAH VENUE BAHARU -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-success text-white fw-bold">Tambah Venue Baharu</div>
            <div class="card-body">
                <form id="addVenueForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Nama Venue</label>
                            <input type="text" id="vName" class="form-control" placeholder="cth: Dewan Perdana UPTM" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Lokasi</label>
                            <input type="text" id="vLoc" class="form-control" placeholder="cth: Kuala Lumpur" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Kapasiti (Orang)</label>
                            <input type="number" id="vCap" class="form-control" placeholder="cth: 500" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Kadar Sewa / Hari (RM)</label>
                            <input type="number" step="0.01" id="vPrice" class="form-control" placeholder="cth: 1200.00" required>
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-success fw-bold">Simpan Venue</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- SENARAI VENUE TERDAFTAR -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white fw-bold">Senarai Venue Terdaftar</div>
            <div class="card-body">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-secondary">
                        <tr>
                            <th>ID</th>
                            <th>Nama Venue</th>
                            <th>Lokasi</th>
                            <th>Kapasiti</th>
                            <th>Kadar Sewa (RM/Hari)</th>
                            <th>Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="venueTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
