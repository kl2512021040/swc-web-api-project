<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Urus Venue - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <a href="index.html" class="btn btn-secondary mb-3">&larr; Kembali</a>
        <h2 class="mb-4">Pengurusan Dewan / Venue</h2>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-success text-white">Tambah Venue Baharu</div>
            <div class="card-body">
                <form id="addVenueForm">
                    <div class="row g-3">
                        <div class="col-md-3"><input type="text" id="vName" class="form-control" placeholder="Nama Venue" required></div>
                        <div class="col-md-3"><input type="text" id="vLoc" class="form-control" placeholder="Lokasi" required></div>
                        <div class="col-md-2"><input type="number" id="vCap" class="form-control" placeholder="Kapasiti" required></div>
                        <div class="col-md-2"><input type="number" id="vPrice" class="form-control" placeholder="Harga/Hari" required></div>
                        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Simpan</button></div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped">
                    <thead><tr><th>ID</th><th>Nama</th><th>Lokasi</th><th>Kapasiti</th><th>Harga (RM)</th><th>Tindakan</th></tr></thead>
                    <tbody id="venueTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
