<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Borang Tempahan Tiket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <a href="index.html" class="btn btn-secondary mb-3">&larr; Kembali</a>
        <div class="card shadow">
            <div class="card-header bg-success text-white">Borang Tempahan Tiket</div>
            <div class="card-body">
                <div id="eventDetails" class="alert alert-info">Pemuatan maklumat acara...</div>
                <form id="bookingForm">
                    <input type="hidden" id="eventId">
                    <div class="mb-3">
                        <label>Kuantiti Tiket</label>
                        <input type="number" id="qty" class="form-control" value="1" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Sahkan & Bayar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
