<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Log Masuk Pengguna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 400px;">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center">Log Masuk / Login JWT</div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3"><label>E-mel</label><input type="email" id="email" class="form-control" value="ameer@customer.com" required></div>
                    <div class="mb-3"><label>Kata Laluan</label><input type="password" id="password" class="form-control" value="123456" required></div>
                    <button type="submit" class="btn btn-primary w-100">Log Masuk</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
