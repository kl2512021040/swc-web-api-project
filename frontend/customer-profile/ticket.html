<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Log Masuk & Pendaftaran Pengguna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 450px;">
        <div class="card shadow mb-4">
            <div class="card-header bg-dark text-white text-center">Log Masuk / Login</div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label>E-mel</label>
                        <input type="email" id="email" class="form-control" value="ameer@customer.com" required>
                    </div>
                    <div class="mb-3">
                        <label>Kata Laluan</label>
                        <input type="password" id="password" class="form-control" value="123456" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log Masuk</button>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">Daftar Akaun Baharu (Add Account)</div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="mb-3">
                        <label>Nama Penuh</label>
                        <input type="text" id="regName" class="form-control" placeholder="Ameer Hafiy" required>
                    </div>
                    <div class="mb-3">
                        <label>E-mel</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="ameer2@customer.com" required>
                    </div>
                    <div class="mb-3">
                        <label>Kata Laluan</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="123456" required>
                    </div>
                    <div class="mb-3">
                        <label>Peranan (Role)</label>
                        <select id="regRole" class="form-select">
                            <option value="Customer">Customer</option>
                            <option value="Organiser">Organiser</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Daftar Akaun</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
