<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Acara - Organiser Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Pengurusan Acara (Events Management)</h2>
            <a href="index.html" class="btn btn-outline-secondary">&larr; Kembali ke Dashboard Organiser</a>
        </div>

        <!-- BORANG CIPTA ACARA BAHARU -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">Cipta & Terbitkan Acara Baharu</div>
            <div class="card-body">
                <form id="addEventForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tajuk Acara</label>
                            <input type="text" id="eTitle" class="form-control" placeholder="cth: Web API Workshop 2026" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Tarikh Acara</label>
                            <input type="date" id="eDate" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Pilih Venue (Dari Admin)</label>
                            <select id="eVenue" class="form-select" required>
                                <option value="">-- Memuatkan Venue... --</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Keterangan / Penerangan Acara</label>
                            <textarea id="eDesc" class="form-control" rows="2" placeholder="Sertakan maklumat ringkas acara..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Jumlah Tiket Disediakan</label>
                            <input type="number" id="eTickets" class="form-control" placeholder="cth: 100" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Harga Setiket (RM)</label>
                            <input type="number" step="0.01" id="ePrice" class="form-control" placeholder="cth: 50.00" required>
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-primary fw-bold">Terbitkan Acara</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- SENARAI ACARA TERDAFTAR -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white fw-bold">Senarai Acara Aktif</div>
            <div class="card-body">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-secondary">
                        <tr>
                            <th>ID</th>
                            <th>Tajuk Acara</th>
                            <th>Tarikh</th>
                            <th>Venue</th>
                            <th>Baki Tiket</th>
                            <th>Harga Tiket</th>
                            <th>Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="eventsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
