<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Organiser Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Portal Penganjur (Organiser Portal)</h2>
            <a href="events.html" class="btn btn-primary">+ Cipta Acara Baharu</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">Senarai Acara Anjuran Saya</div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead><tr><th>ID</th><th>Tajuk Acara</th><th>Tarikh</th><th>Venue</th><th>Harga Tiket</th><th>Baki Tiket</th><th>Tindakan</th></tr></thead>
                    <tbody id="organiserEvents"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost/swc-web-api-project/backend/index.php';

        async function loadOrganiserEvents() {
            const res = await fetch(`${API_BASE}/events`);
            const json = await res.json();
            const tbody = document.getElementById('organiserEvents');
            tbody.innerHTML = '';

            json.data.forEach(e => {
                tbody.innerHTML += `
                    <tr>
                        <td>${e.id}</td>
                        <td><strong>${e.title}</strong></td>
                        <td>${e.event_date}</td>
                        <td>${e.venue_name}</td>
                        <td>RM ${e.ticket_price}</td>
                        <td><span class="badge bg-warning text-dark">${e.available_tickets}</span></td>
                        <td><button onclick="deleteEvent(${e.id})" class="btn btn-sm btn-outline-danger">Batal/Padam</button></td>
                    </tr>
                `;
            });
        }

        async function deleteEvent(id) {
            if(confirm('Padam acara ini?')) {
                await fetch(`${API_BASE}/events/${id}`, { method: 'DELETE' });
                loadOrganiserEvents();
            }
        }

        loadOrganiserEvents();
    </script>
</body>
</html>
