<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiser Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- NAVBAR ORGANISER -->
    <nav class="navbar navbar-dark bg-dark mb-4 px-4 d-flex justify-content-between align-items-center">
        <span class="navbar-brand fw-bold mb-0">Portal Penganjur (Organiser)</span>
        <button onclick="logout()" class="btn btn-outline-danger btn-sm fw-bold">Log Out</button>
    </nav>

    <div class="container my-4">
        <h2>Dashboard Penganjur Acara</h2>
        <p>Uruskan acara, kadar sewa dewan, dan tiket penerbitan anda di sini.</p>
        <a href="events.html" class="btn btn-primary fw-bold">Pengurusan Acara & Terbit Tiket &rarr;</a>
    </div>

    <script>
        function checkSession() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                window.location.href = '../../index.html';
            }
        }
        function logout() {
            if (confirm('Adakah anda pasti ingin log keluar?')) {
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                window.location.href = '../../index.html';
            }
        }
        document.addEventListener('DOMContentLoaded', checkSession);
    </script>
</body>
</html>
