<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Pengimbas Tiket QR - Organiser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Script Library QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light text-center p-4">

    <div class="container" style="max-width: 500px;">
        <h3 class="fw-bold mb-3">Imbas Tiket Digital Pelanggan</h3>
        <div id="reader" width="100%" class="border bg-white rounded shadow-sm"></div>
        <div id="result" class="alert alert-info mt-3 d-none"></div>
        <a href="index.html" class="btn btn-secondary mt-3">&larr; Kembali ke Dashboard</a>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('d-none');
            resultDiv.innerHTML = `<strong>Tiket Sah!</strong><br>${decodedText}`;
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
